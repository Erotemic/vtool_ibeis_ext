[build-system]
requires = ["maturin>=1.5", "numpy>=1.21"]
build-backend = "maturin"

[project]
name = "vtool_ibeis_ext"
version = "0.2.0"
description = "Rust-backed spatial verification helpers for vtool_ibeis_ext"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jon Crall", email = "erotemic@gmail.com" },
  { name = "Avi Weinstock" },
]
keywords = ["computer-vision", "spatial-verification", "affine", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy>=1.21"]
tests = ["pytest>=7.0", "numpy>=1.21"]
optional = []
headless = []

[tool.maturin]
module-name = "vtool_ibeis_ext._sver"
features = ["pyo3/extension-module"]

[tool.cibuildwheel]
build = "cp39-*"
skip = "pp* *-musllinux_* *i686"
build-verbosity = 1
test-command = "python -m pytest -q {project}/tests"
test-requires = ["pytest>=7.0", "numpy>=1.21"]

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y && source $HOME/.cargo/env && rustup show"

environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.pytest.ini_options]
addopts = "-q"
