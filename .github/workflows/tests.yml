name: BinPyCI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build_binpy_wheels:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m maturin build -o wheelhouse
          python - <<'PY'
          import pathlib
          print('wheelhouse contents:')
          for item in sorted(pathlib.Path('wheelhouse').glob('*')):
              print(' -', item)
          PY

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-auto
          path: wheelhouse/vtool_ibeis_ext*.whl

  test_binpy_wheels:
    name: test ${{ matrix.os }} / py${{ matrix.python-version }}
    if: "! startsWith(github.event.ref, 'refs/heads/release')"
    runs-on: ${{ matrix.os }}
    needs: [build_binpy_wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy xdoctest pytest-cov packaging
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          from packaging import tags
          from packaging.utils import parse_wheel_filename

          wheels = sorted(pathlib.Path('wheelhouse').glob('vtool_ibeis_ext*.whl'))
          if not wheels:
              raise SystemExit('No wheel artifacts found in wheelhouse')

          supported = set(tags.sys_tags())
          chosen = None
          print('Available wheels:')
          for wheel in wheels:
              print(' -', wheel)
              try:
                  _, _, _, wheel_tags = parse_wheel_filename(wheel.name)
              except Exception:
                  continue
              if any(t in supported for t in wheel_tags):
                  chosen = wheel

          if chosen is None:
              raise SystemExit('No compatible wheel found for current platform/python')

          print('Selected compatible wheel:', chosen)
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(chosen)])
          PY

      - name: Diagnostics
        shell: bash
        run: |
          DIAG_SANDBOX="$(mktemp -d)"
          cd "$DIAG_SANDBOX"
          python - <<'PY'
          import os
          import sys
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          sys.path = [p for p in sys.path if workspace not in os.path.abspath(p)]
          import vtool_ibeis_ext
          _sver = vtool_ibeis_ext._sver
          if _sver is None:
              raise RuntimeError('vtool_ibeis_ext._sver backend was not loaded')
          print('Python:', sys.version)
          print('Workspace:', workspace)
          print('sys.path[0]:', sys.path[0])
          print('Package path:', vtool_ibeis_ext.__file__)
          print('Extension path:', _sver.__file__)
          PY

      - name: Run tests in sandbox
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          sandbox = pathlib.Path(tempfile.mkdtemp(prefix='vtool-tests-'))
          shutil.copytree(workspace / 'tests', sandbox / 'tests')
          cmd = [
              sys.executable,
              '-m', 'pytest',
              '--verbose',
              '-p', 'pytester',
              '-p', 'no:doctest',
              '--xdoctest',
              '--cov-config', str(workspace / 'pyproject.toml'),
              '--cov-report', 'term',
              '--durations=100',
              '--cov=vtool_ibeis_ext',
              'tests',
          ]
          print('Sandbox:', sandbox)
          print('Running:', ' '.join(cmd))
          subprocess.check_call(cmd, cwd=sandbox)
          PY

  test_deploy:
    name: Deploy Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && ! startsWith(github.event.ref, 'refs/heads/release')
    needs: [build_binpy_wheels]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Show files to upload
        shell: bash
        run: ls -la wheelhouse

      - name: Sign and Publish to TestPyPI
        env:
          TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_TWINE_PASSWORD }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
        shell: bash
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "No TEST_TWINE_PASSWORD set; skipping test deploy"
            exit 0
          fi
          GPG_EXECUTABLE=gpg
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_public_gpg_key.pgp.enc | $GPG_EXECUTABLE --import
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/gpg_owner_trust.enc | $GPG_EXECUTABLE --import-ownertrust
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_secret_gpg_subkeys.pgp.enc | $GPG_EXECUTABLE --import
          GPG_KEYID=$(cat dev/public_gpg_key)
          for WHEEL_PATH in wheelhouse/*.whl; do
            $GPG_EXECUTABLE --batch --yes --detach-sign --armor --local-user "$GPG_KEYID" --output "$WHEEL_PATH.asc" "$WHEEL_PATH"
          done
          python -m pip install --upgrade pip twine opentimestamps-client
          ots stamp wheelhouse/*.whl wheelhouse/*.asc
          twine upload --username "$TWINE_USERNAME" --password "$TWINE_PASSWORD" --repository-url "$TWINE_REPOSITORY_URL" wheelhouse/*.whl --skip-existing --verbose

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy_artifacts
          path: |
            wheelhouse/*.whl
            wheelhouse/*.asc
            wheelhouse/*.ots

  live_deploy:
    name: Deploy Live
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.event.ref, 'refs/tags') || startsWith(github.event.ref, 'refs/heads/release'))
    needs: [build_binpy_wheels]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Show files to upload
        shell: bash
        run: ls -la wheelhouse

      - name: Sign and Publish to PyPI
        env:
          TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          CI_SECRET: ${{ secrets.CI_SECRET }}
        shell: bash
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "No TWINE_PASSWORD set; skipping live deploy"
            exit 0
          fi
          GPG_EXECUTABLE=gpg
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_public_gpg_key.pgp.enc | $GPG_EXECUTABLE --import
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/gpg_owner_trust.enc | $GPG_EXECUTABLE --import-ownertrust
          openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_secret_gpg_subkeys.pgp.enc | $GPG_EXECUTABLE --import
          GPG_KEYID=$(cat dev/public_gpg_key)
          for WHEEL_PATH in wheelhouse/*.whl; do
            $GPG_EXECUTABLE --batch --yes --detach-sign --armor --local-user "$GPG_KEYID" --output "$WHEEL_PATH.asc" "$WHEEL_PATH"
          done
          python -m pip install --upgrade pip twine opentimestamps-client
          ots stamp wheelhouse/*.whl wheelhouse/*.asc
          twine upload --username "$TWINE_USERNAME" --password "$TWINE_PASSWORD" --repository-url "$TWINE_REPOSITORY_URL" wheelhouse/*.whl --skip-existing --verbose

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy_artifacts
          path: |
            wheelhouse/*.whl
            wheelhouse/*.asc
            wheelhouse/*.ots

  release:
    name: Create Github Release
    if: github.event_name == 'push' && (startsWith(github.event.ref, 'refs/tags') || startsWith(github.event.ref, 'refs/heads/release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [live_deploy]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy_artifacts
          path: wheelhouse

      - name: Show files to release
        shell: bash
        run: ls -la wheelhouse

      - name: Tag Release Commit
        if: startsWith(github.event.ref, 'refs/heads/release')
        shell: bash
        run: |
          VERSION=$(python -c "import vtool_ibeis_ext as m; print(m.__version__)")
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          body: Automatic Release
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            wheelhouse/*.whl
            wheelhouse/*.asc
            wheelhouse/*.ots
