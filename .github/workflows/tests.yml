name: BinPyCI

on:
  push:
  pull_request:

jobs:
  build_binpy_wheels:
    name: build wheel (ubuntu, py3.9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m maturin build -o wheelhouse
          ls -al wheelhouse

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-latest-auto
          path: wheelhouse/vtool_ibeis_ext*.whl

  test_binpy_wheels:
    name: test wheel (ubuntu, py3.9)
    runs-on: ubuntu-latest
    needs:
      - build_binpy_wheels
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy xdoctest pytest-cov
          python - <<'PY'
          import pathlib
          wheels = sorted(pathlib.Path('wheelhouse').glob('vtool_ibeis_ext*.whl'))
          if not wheels:
              raise SystemExit('No wheel artifacts found in wheelhouse')
          print('Selected wheel:', wheels[-1])
          PY
          python -m pip install --force-reinstall wheelhouse/vtool_ibeis_ext*.whl

      - name: Diagnostics
        run: |
          DIAG_SANDBOX="$(mktemp -d)"
          cd "$DIAG_SANDBOX"
          python - <<'PY'
          import sys
          import os
          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          sys.path = [p for p in sys.path if workspace not in os.path.abspath(p)]
          import vtool_ibeis_ext
          import vtool_ibeis_ext._sver as _sver
          print('Python:', sys.version)
          print('sys.path[0]:', sys.path[0])
          print('Package path:', vtool_ibeis_ext.__file__)
          print('Extension path:', _sver.__file__)
          PY

      - name: Run tests in sandbox
        run: |
          TEST_SANDBOX="$(mktemp -d)"
          cp -r tests "$TEST_SANDBOX/tests"
          cd "$TEST_SANDBOX"
          python -m pytest --verbose -p pytester -p no:doctest --xdoctest --cov-config ${GITHUB_WORKSPACE}/pyproject.toml --cov-report term --durations=100 --cov=vtool_ibeis_ext tests
