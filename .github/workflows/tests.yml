name: BinPyCI

on:
  push:
  pull_request:

jobs:
  build_binpy_wheels:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m maturin build -o wheelhouse
          python - <<'PY'
          import pathlib
          print('wheelhouse contents:')
          for item in sorted(pathlib.Path('wheelhouse').glob('*')):
              print(' -', item)
          PY

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-auto
          path: wheelhouse/vtool_ibeis_ext*.whl

  test_binpy_wheels:
    name: test ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [build_binpy_wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy xdoctest pytest-cov
          python - <<'PY'
          import pathlib
          wheels = sorted(pathlib.Path('wheelhouse').glob('vtool_ibeis_ext*.whl'))
          if not wheels:
              raise SystemExit('No wheel artifacts found in wheelhouse')
          print('Available wheels:')
          for wheel in wheels:
              print(' -', wheel)
          PY
          python -m pip install --force-reinstall vtool_ibeis_ext==1.0.0 -f wheelhouse

      - name: Diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import vtool_ibeis_ext
          _sver = vtool_ibeis_ext._sver
          if _sver is None:
              raise RuntimeError('vtool_ibeis_ext._sver backend was not loaded')
          print('Python:', sys.version)
          print('Workspace:', os.environ.get('GITHUB_WORKSPACE'))
          print('Package path:', vtool_ibeis_ext.__file__)
          print('Extension path:', _sver.__file__)
          PY

      - name: Run tests in sandbox
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import tempfile
          import pathlib
          import subprocess
          import sys

          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          sandbox = pathlib.Path(tempfile.mkdtemp(prefix='vtool-tests-'))
          shutil.copytree(workspace / 'tests', sandbox / 'tests')
          cmd = [
              sys.executable,
              '-m', 'pytest',
              '--verbose',
              '-p', 'pytester',
              '-p', 'no:doctest',
              '--xdoctest',
              '--cov-config', str(workspace / 'pyproject.toml'),
              '--cov-report', 'term',
              '--durations=100',
              '--cov=vtool_ibeis_ext',
              'tests',
          ]
          print('Sandbox:', sandbox)
          print('Running:', ' '.join(cmd))
          subprocess.check_call(cmd, cwd=sandbox)
          PY
