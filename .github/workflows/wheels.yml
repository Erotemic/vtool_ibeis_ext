name: Build wheels

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.20.0
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "pp* *-musllinux_* *i686"
          CIBW_TEST_COMMAND: "python -m pytest -q {project}/tests"
          CIBW_TEST_REQUIRES: "pytest>=7.0 numpy>=1.21"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
